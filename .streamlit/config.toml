[theme]
base = "light"
primaryColor = "#800020"
backgroundColor = "#F9F9FB"
secondaryBackgroundColor = "#F4F4F7"
textColor = "#111113"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = true
enableXsrfProtection = true
# Coincide con el límite que se informa en la pantalla de FUDO.
maxUploadSize = 25
# Publica la carpeta static/ (logo y fotografía) en app/static/.
enableStaticServing = true

[browser]
gatherUsageStats = false
